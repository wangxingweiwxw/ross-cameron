<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · __SITE__</title>

<style>
__BASECSS__
__SERIESCSS__
/* ---------- profile ---------- */
.mast{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:44px;padding:52px 0 28px;align-items:start}
.kick{font:12px var(--mono);letter-spacing:.16em;color:var(--ac);margin:0 0 16px}
.mast h1{margin:0 0 20px;font-size:clamp(44px,6.6vw,86px);line-height:1;letter-spacing:-.02em;font-weight:800}.mast h1 span{display:block;font-size:.42em;letter-spacing:0;color:var(--ac);margin-top:12px;font-weight:700}
.lede{margin:0;max-width:720px;color:var(--dim);font-size:17px;line-height:1.95}.lede b{color:var(--text);font-weight:600}
.facts{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 10px}.facts h2{margin:0 0 4px;font:12px var(--mono);letter-spacing:.12em;color:var(--mute);font-weight:400}
.fact{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;border-top:1px solid var(--line);padding:7px 0;font-size:13.5px;line-height:1.6}.fact:first-of-type{border-top:0}.fact span{color:var(--mute)}.fact b{font-weight:500}
.facts .fsrc{font-size:11.5px;color:var(--mute);margin:6px 0 0}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:16px}
.strip div{padding:16px 18px;border-left:1px solid var(--line)}.strip div:first-child{border-left:0}.strip b{display:block;font:600 clamp(19px,2vw,26px)/1.3 var(--sans);letter-spacing:-.01em}.strip small{font-size:12.5px;color:var(--mute)}
.warn{display:flex;gap:14px;align-items:flex-start;background:#2a2112;border:1px solid #4a3a1c;border-radius:var(--r);padding:13px 16px;font-size:14px;color:#e9d9b8;margin:0}.warn b{color:var(--amber2)}
section.block{padding-top:64px}
.shead{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px}
.shead h2{margin:0;font-size:clamp(24px,2.6vw,32px);letter-spacing:-.01em;line-height:1.3}.shead h2 small{display:block;font:12px var(--mono);letter-spacing:.14em;color:var(--ac);margin-bottom:6px;font-weight:400}
.intro{margin:-6px 0 22px;max-width:780px;color:var(--dim);font-size:15.5px;line-height:1.9}.intro b{color:var(--text)}
.prose{max-width:780px}
sup.c{font:600 10.5px var(--mono);margin-left:1px;vertical-align:super;line-height:0}sup.c a{color:var(--ac);text-decoration:none;padding:0 1px}sup.c a:hover{color:var(--text);text-decoration:underline}
.t{border:0;background:none;padding:0;font:inherit;font-weight:600;color:inherit;text-decoration:underline dotted var(--ac);text-underline-offset:4px;text-decoration-thickness:1.5px}.t:hover{color:var(--ac)}
/* brief */
.brief{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;counter-reset:b}
.brief li{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 16px 52px;font-size:15px;line-height:1.85;color:var(--dim)}.brief li b{color:var(--text)}
.brief li:before{counter-increment:b;content:counter(b,decimal-leading-zero);position:absolute;left:18px;top:18px;font:12px var(--mono);color:var(--ac)}
/* chart */
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 12px}
.chartbox h3{margin:0;font-size:15px}.chartbox .sub{font-size:12.5px;color:var(--mute);margin:2px 0 0}
.plot{position:relative;margin-top:10px}.plot svg{display:block;width:100%;overflow:visible}
.plot .grid line{stroke:var(--line);stroke-width:1}.plot .ax text{fill:var(--mute);font:11.5px var(--mono)}.plot .lab{fill:var(--dim);font:600 12.5px var(--sans)}.plot .ann{fill:var(--mute);font:11.5px var(--sans)}
.plot .hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;line-height:1.55;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.45);transform:translate(-50%,calc(-100% - 14px));display:none;z-index:2}.tip b{display:block;font-size:15px}.tip small{color:var(--mute)}
.notes{margin:16px 0 0;padding:0;list-style:none}.notes li{position:relative;padding:8px 0 8px 18px;font-size:14.5px;line-height:1.85;color:var(--dim);border-top:1px solid var(--line)}.notes li:first-child{border-top:0}.notes li:before{content:"";position:absolute;left:2px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--ac-mark)}
.tblbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px 10px}.tblbox h3{margin:0 0 4px;font-size:15px}.tblbox td{line-height:1.7;color:var(--dim)}.tblbox td:first-child{color:var(--text)}.tblbox tr.hl td{background:var(--ac-bg);color:var(--text)}.tblbox tr:last-child td{border-bottom:0}th.num{text-align:right}.tblbox th{white-space:nowrap}
details.tbl{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}details.tbl summary{cursor:pointer;font-size:13px;color:var(--mute);padding:4px 0}details.tbl summary:hover{color:var(--text)}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--mute);font-weight:500;background:var(--panel2)}td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}th.num{text-align:right}
/* timeline */
.tl{list-style:none;margin:0;padding:0;max-width:880px}.tl li{display:grid;grid-template-columns:112px minmax(0,1fr);gap:20px;padding:15px 0;border-top:1px solid var(--line)}.tl li:first-child{border-top:0}
.tl .when{font:600 13px/1.9 var(--mono);color:var(--ac)}.tl b{display:block;font-size:16.5px;margin-bottom:3px}.tl p{margin:0;font-size:15px;color:var(--dim);line-height:1.9}
/* methods */
.methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.mcard .tag{align-self:flex-start;font:11.5px var(--mono);color:var(--ac);border:1px solid var(--ac-line);background:var(--ac-bg);border-radius:5px;padding:1px 8px}
.mcard h3{margin:0;font-size:18px;line-height:1.45}.mcard p{margin:0;font-size:15px;line-height:1.9;color:var(--dim)}
.q{margin:0;background:var(--panel2);border-left:3px solid var(--ac-mark);border-radius:0 8px 8px 0;padding:11px 14px}.q p[lang]{font-size:14px;color:var(--text);line-height:1.8}.q p.zh{font-size:13.5px;color:var(--dim);margin-top:4px}.q footer{all:unset;display:block;font:11.5px var(--mono);color:var(--mute);margin-top:6px}
.mcard .note{font-size:13px;color:var(--mute);line-height:1.8}
.test{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:8px;padding:14px 18px;font-size:14.5px;line-height:1.9;color:var(--dim);max-width:880px}.test b{color:var(--amber2)}
/* case */
.case{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.steps{list-style:none;margin:0;padding:0;border-left:2px solid var(--line2);margin-left:6px}.steps li{position:relative;padding:0 0 18px 22px}.steps li:before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--ac-mark);box-shadow:0 0 0 3px var(--bg)}
.steps .ts{display:block;font:600 13px var(--mono);color:var(--ac)}.steps p{margin:2px 0 0;font-size:15px;line-height:1.85;color:var(--dim)}.steps b{color:var(--text)}
.side{display:flex;flex-direction:column;gap:14px}.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}.box h3{margin:0 0 8px;font:12px var(--mono);letter-spacing:.12em;color:var(--mute);font-weight:400}
.calc{font:13.5px/2 var(--mono);color:var(--dim);overflow-wrap:anywhere}.calc .big{display:block;font:600 24px var(--sans);color:var(--text);margin-top:4px}.box .small{font-size:12.5px;color:var(--mute);margin:8px 0 0;line-height:1.7}
.box p{margin:0;font-size:14.5px;line-height:1.9;color:var(--dim)}.box ul{margin:0;padding:0 0 0 18px}.box li{font-size:14px;line-height:1.85;color:var(--dim);padding:3px 0}
/* quotes */
.quotes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.quote{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.quote p[lang]{margin:0;font-size:15px;line-height:1.85}.quote p.zh{margin:0;font-size:15px;line-height:1.85;color:var(--dim)}.quote p.zh.only{font-size:16.5px;color:var(--text)}
.quote footer{all:unset;margin-top:auto;padding-top:6px;font-size:12px;color:var(--mute)}.quote .kind{font:10.5px var(--mono);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-right:6px}
/* myths */
.myths{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:980px}
.myth{display:grid;grid-template-columns:minmax(0,.9fr) 104px minmax(0,1.6fr);gap:18px;padding:15px 18px;border-top:1px solid var(--line);background:var(--panel);align-items:start}.myth:first-child{border-top:0}
.myth .claim{font-size:15px;font-weight:600;line-height:1.7}.myth .claim:before{content:"“";color:var(--mute)}.myth .claim:after{content:"”";color:var(--mute)}
.verdict{justify-self:start;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap;border:1px solid}.v-no{color:#ffb4a8;border-color:#5a2721;background:#2a1715}.v-mid{color:var(--amber2);border-color:#4a3a1c;background:#2a2112}.v-na{color:var(--dim);border-color:var(--line2);background:var(--panel2)}
.myth p{margin:0;font-size:14.5px;line-height:1.85;color:var(--dim)}
/* glossary */
.gloss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.gterm{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.gterm h3{margin:0;font-size:16px}.gterm h3 small{display:block;font:12.5px var(--jp);color:var(--mute);font-weight:400;margin-top:2px}.gterm p{margin:8px 0 0;font-size:14px;line-height:1.8;color:var(--dim)}
.gterm:target{border-color:var(--ac)}
/* sources */
.srcs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 32px;counter-reset:s}
.srcs li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.65}
.srcs li .n{font:600 12px/1.9 var(--mono);color:var(--ac)}.srcs li .ti{color:var(--text)}.srcs li a.ti{color:var(--cyan)}.srcs li small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.srcs .ty{font:10.5px var(--mono);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-right:6px;color:var(--dim)}.srcs li:target{background:var(--ac-bg)}
/* term popover */
.term{position:fixed;right:16px;bottom:16px;width:360px;z-index:70;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:18px 20px;display:none}.term.on{display:block}
.term .x{position:absolute;right:10px;top:6px;border:0;background:none;font-size:22px;color:var(--mute)}.term h3{margin:0;font-size:19px}.term h3 small{display:block;font:13px var(--jp);color:var(--mute);font-weight:400}.term p{margin:10px 0 0;font-size:14.5px;line-height:1.85;color:var(--dim)}
.more{margin-top:56px;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;background:var(--panel);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}.more p{margin:0;font-size:14.5px;color:var(--dim)}.more nav{display:flex;flex-wrap:wrap;gap:8px}.more a{font-size:14px;border:1px solid var(--line2);border-radius:8px;padding:6px 12px;text-decoration:none;color:var(--text)}.more a:hover{border-color:var(--ac)}
@media(min-width:981px){.rail .logo{display:none}}
@media(max-width:1180px){.mast{grid-template-columns:1fr;gap:26px}.facts{max-width:560px}.gloss{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:980px){.term{left:0;right:0;bottom:0;width:auto;border-radius:14px 14px 0 0}}
@media(max-width:860px){.methods,.quotes,.brief,.case,.srcs{grid-template-columns:1fr}.myth{grid-template-columns:1fr;gap:6px}}
@media(max-width:720px){.mast{padding-top:30px}.lede{font-size:15.5px}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip div{border-left:0;border-top:1px solid var(--line)}.strip div:nth-child(-n+2){border-top:0}.strip div:nth-child(even){border-left:1px solid var(--line)}.strip div:last-child{grid-column:1/-1;border-left:0}
.tl li{grid-template-columns:1fr;gap:2px}.gloss{grid-template-columns:1fr}.brief li{padding-left:46px}}
